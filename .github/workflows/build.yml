name: Build AniGoose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch current ani-cli script from upstream
        run: |
          mkdir -p app/src/main/assets
          if [ -f app/src/main/assets/ani-cli ]; then
            echo "ani-cli already present in assets/ — leaving your committed copy alone."
          else
            echo "Downloading latest ani-cli from pystardust/ani-cli (master)..."
            curl -fsSL -o app/src/main/assets/ani-cli \
              https://raw.githubusercontent.com/pystardust/ani-cli/master/ani-cli
            chmod +x app/src/main/assets/ani-cli
            head -1 app/src/main/assets/ani-cli | grep -q '^#!' \
              && echo "Downloaded OK ($(wc -l < app/src/main/assets/ani-cli) lines)." \
              || (echo "::error::Downloaded file doesn't look like a script — aborting." && exit 1)
          fi

      - name: Check bootstrap rootfs assets are present
        run: |
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="app/src/main/assets/bootstrap-$abi.zip"
            if [ ! -f "$f" ]; then
              echo "::warning::Missing $f — app will compile but won't run until this is added. See bootstrap/README.md"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Continuing build anyway — this only affects runtime, not compilation."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anigoose-debug-apk
          path: app/build/outputs/apk/debug/*.apk
